version: "1"
kind: miner
id: 2611217
slug: moneyowed-sla
protocol: generic
name: MONEY OWED Contract SLA Check
description: >-
  Contract-scoped SLA compliance for 17 vendors with written uptime commitments: GitHub Enterprise Cloud,
  Jira, Confluence, Jira Service Management, Bitbucket, Vercel, DigitalOcean, Twilio, Linode, Mailgun, Sanity,
  Prisma, Mapbox, Buildkite, AWS, Google Cloud and Microsoft Azure. Uptime is computed from the vendor's own
  public incident history, counting only time the vendor marked a covered service as down (degraded
  performance and scheduled maintenance excluded), and compared with the target in the vendor's published
  SLA. Calendar months and quarters match the billing period the SLA uses and also return the service credit
  owed and the claim deadline. Every answer lists each incident with whether it counted and why.
  Also answers live uptime and API health checks for any public HTTP or HTTPS address, adding the vendor's
  own open incidents and 30-day uptime when the address belongs to a tracked vendor.
base_url: https://moneyowed.38-49-216-59.sslip.io

rate_limit_per_sec: 5
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  website: https://moneyowed.38-49-216-59.sslip.io
  documentation: https://moneyowed.38-49-216-59.sslip.io/evidence

endpoints:
  - path: /sla-compliance
    external_path: /miner/sla
    method: GET
    description: >-
      Whether a named vendor met its published uptime SLA over a past period. Send the vendor (optionally with
      the covered service, plan and, for AWS, Google Cloud and Azure, the region) as service, and the period as
      period. Returns uptime_pct, sla_target_pct, compliant, the period measured, downtime minutes, the
      incidents counted and excluded with reasons, and for whole billing periods the credit percent and
      claim deadline.
    intents: [SLA_COMPLIANCE_GENERAL]
    params:
      query:
        required:
          - name: service
            type: string
            intents: ["*"]
            description: >-
              Vendor name as written in the question, optionally with service, plan or region, for example
              "GitHub", "GitHub Actions", "Jira Premium", "Vercel", "DigitalOcean Droplets",
              "Amazon EC2 us-east-1", "Compute Engine us-central1", "Azure Virtual Machines East US".
              AWS, Google Cloud and Azure need one service and one region.
          - name: period
            type: string
            intents: ["*"]
            description: >-
              Past period, copied from the question: "last 30 days", "last 7 days", "last 24 hours",
              "last month", "last quarter", "2026-10", "October 2026", "2026-Q3", or
              "2026-09-01 to 2026-09-30" (both dates included). Up to 400 days back.
        optional:
          - name: plan
            type: string
            intents: ["*"]
            description: Plan name when the vendor has several SLAs, for example "premium" or "enterprise". Defaults to the first plan with an SLA.

  - path: /server-uptime
    external_path: /miner/uptime
    method: GET
    description: >-
      Live availability check of one HTTP or HTTPS address. Sends a GET with redirects followed (each hop
      checked), retries once on a network error, and returns is_up, status_code, latency_ms and a verdict.
      When the address belongs to a tracked vendor (GitHub, Atlassian, Vercel, DigitalOcean, Twilio and others)
      it adds the open incidents from that vendor's own status page and its last-30-days uptime from the
      vendor's incident history. Private and internal addresses are refused, never probed.
    intents: [SERVER_UPTIME_MONITOR_GENERAL]
    params:
      query:
        required:
          - name: url
            type: string
            intents: ["*"]
            description: >-
              The address to check, copied from the question, for example "https://api.github.com" or
              "example.com/health". A bare host name is checked over https.
  - path: /api-health
    external_path: /miner/api-health
    method: GET
    description: >-
      Live health check of one REST or GraphQL endpoint: HTTP status, latency, content type and whether a JSON
      body parses, with the top-level keys. Adds the vendor's open status-page incidents for tracked vendors.
      Private and internal addresses are refused, never probed.
    intents: [API_HEALTH_CHECK_GENERAL]
    params:
      query:
        required:
          - name: url
            type: string
            intents: ["*"]
            description: The endpoint address copied from the question, for example "https://api.example.com/v1/status".

input_schema:
  type: object
  required: [service, period]
  properties:
    service:
      type: string
      description: Vendor, optionally with service, plan and region.
    period:
      type: string
      description: Past period, e.g. last 30 days, 2026-10, 2026-Q3.
    plan:
      type: string
      description: Optional plan name.

output_schema:
  type: object
  required: [service, uptime_pct, sla_target_pct, compliant, period]
  properties:
    service: { type: string, description: Service checked, with region when given }
    uptime_pct: { type: number, description: "Uptime on covered services, percent 0-100" }
    sla_target_pct: { type: number, description: Uptime target from the vendor's published SLA, percent }
    compliant: { type: boolean, description: True when uptime_pct is at or above sla_target_pct }
    period: { type: string, description: Period measured }
    period_start: { type: string, description: ISO 8601 }
    period_end: { type: string, description: ISO 8601 }
    downtime_minutes: { type: number }
    allowed_downtime_minutes: { type: number }
    credit_pct: { type: [number, "null"], description: Service credit owed as percent of the period fee; null unless a whole billing period was asked }
    claim_deadline: { type: [string, "null"] }
    answer: { type: string, description: One-sentence summary }
    incidents_counted: { type: integer }
    incidents: { type: array, description: "Each incident: name, start, end, minutes, counted, reason, url" }
    sources: { type: object, description: SLA page URL, quoted target sentence, incident history URL }
    method: { type: string }

errors:
  message_path: error.message
  code_path: error.code

semantics:
  signal_mapping:
    label_field: compliant
    reason_field: answer
  supported_intents:
    - SLA_COMPLIANCE_GENERAL
    - SERVER_UPTIME_MONITOR_GENERAL
    - API_HEALTH_CHECK_GENERAL
